name: Docker Publish

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: runner
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # NEXT_PUBLIC_*-переменные вшиваются в бандл на этапе сборки.
          # Если задать эти секреты в репозитории — образ в GHCR будет
          # содержать реальные значения (для варианта деплоя через
          # `docker compose pull`). Если секреты не заданы — соберётся с
          # заглушками, что нормально для варианта деплоя через
          # `docker compose up -d --build` прямо на сервере (см. job deploy
          # ниже и DEPLOYMENT.md) — там значения берутся из .env сервера.
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_SITE_PHONE=${{ secrets.NEXT_PUBLIC_SITE_PHONE }}
            NEXT_PUBLIC_SITE_EMAIL=${{ secrets.NEXT_PUBLIC_SITE_EMAIL }}
            NEXT_PUBLIC_SITE_TELEGRAM=${{ secrets.NEXT_PUBLIC_SITE_TELEGRAM }}
            NEXT_PUBLIC_SITE_WHATSAPP=${{ secrets.NEXT_PUBLIC_SITE_WHATSAPP }}
            NEXT_PUBLIC_SITE_ADDRESS=${{ secrets.NEXT_PUBLIC_SITE_ADDRESS }}
            NEXT_PUBLIC_SITE_INN=${{ secrets.NEXT_PUBLIC_SITE_INN }}
            NEXT_PUBLIC_SITE_OGRN=${{ secrets.NEXT_PUBLIC_SITE_OGRN }}
            NEXT_PUBLIC_SITE_LEGAL_NAME=${{ secrets.NEXT_PUBLIC_SITE_LEGAL_NAME }}
            NEXT_PUBLIC_YANDEX_METRIKA_ID=${{ secrets.NEXT_PUBLIC_YANDEX_METRIKA_ID }}

  # ---------- Опциональный деплой на VPS по SSH ----------
  # Job активируется только если в секретах репозитория заданы
  # DEPLOY_SSH_HOST, DEPLOY_SSH_USER и DEPLOY_SSH_KEY. Если секреты не
  # настроены — job автоматически пропускается, ничего не ломая в CI.
  # Как настроить (Settings → Secrets and variables → Actions):
  #   DEPLOY_SSH_HOST      — IP или домен VPS
  #   DEPLOY_SSH_USER      — пользователь для SSH (например, deploy)
  #   DEPLOY_SSH_KEY       — приватный SSH-ключ (без пароля)
  #   DEPLOY_SSH_PORT      — порт SSH (опционально, по умолчанию 22)
  #   DEPLOY_PATH          — путь к проекту на сервере (например, /opt/site-project-1)
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true' }}
    steps:
      - name: Deploy via SSH (git pull + rebuild + restart)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            git pull origin main
            # Собираем образ прямо на сервере из актуального кода и .env —
            # так NEXT_PUBLIC_*-переменные гарантированно берутся из
            # реального серверного .env, без дублирования секретов в GitHub.
            docker compose run --rm migrate
            docker compose up -d --build --remove-orphans
            docker image prune -f

