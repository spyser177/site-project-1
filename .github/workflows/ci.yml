name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    env:
      # Плейсхолдер — реальное подключение к БД во время сборки не требуется,
      # переменная нужна только чтобы `prisma generate` и `next build` не падали
      # на валидации схемы datasource.
      DATABASE_URL: "postgresql://user:password@localhost:5432/med_abort_db?schema=public"
      NEXT_PUBLIC_SITE_URL: "https://example.com"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
